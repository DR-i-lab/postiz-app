name: Build DR-I image

# Builds the Postiz image with DR-I's patches (see DRI-PATCHES.md) for the
# amd64 server it runs on. A tag like v2.25.3-dri.1 publishes
# ghcr.io/dr-i-lab/postiz-app:v2.25.3-dri.1.
on:
  push:
    tags:
      - 'v*-dri.*'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          docker buildx build --platform linux/amd64 \
            -f Dockerfile.dev \
            -t ghcr.io/dr-i-lab/postiz-app:${{ github.ref_name }} \
            --build-arg NEXT_PUBLIC_VERSION=${{ github.ref_name }} \
            --pull \
            --provenance=false --sbom=false \
            --push .

      - name: Digest
        run: docker buildx imagetools inspect ghcr.io/dr-i-lab/postiz-app:${{ github.ref_name }}
